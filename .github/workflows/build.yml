name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_installer:
        description: "Créer aussi l'installateur Inno Setup (optionnel)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PT_URL: https://dl.google.com/android/repository/platform-tools_r37.0.1-win.zip
  PT_SHA256: 45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install platform android-34 and build-tools 34.0.0
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build andromirror-server.jar
        run: bash server_android/build.sh

      - name: Upload server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: andromirror-server
          path: |
            server_android/build/andromirror-server.jar
            server_android/build/andromirror-server.jar.sha256
          if-no-files-found: error

  build:
    needs: server
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Java 17 (test du format des messages)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download server (andromirror-server.jar)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: andromirror-server
          path: server_android/build

      - name: Verify server integrity (SHA-256)
        shell: pwsh
        run: |
          $expected = ((Get-Content "server_android/build/andromirror-server.jar.sha256" -Raw).Trim() -split "\s+")[0].ToLower()
          $actual = (Get-FileHash "server_android/build/andromirror-server.jar" -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "SHA-256 du serveur invalide : $actual (attendu $expected)" }
          Write-Host "andromirror-server.jar OK ($actual)"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: FFmpeg licence check (PyAV wheel)
        run: python tools/check_ffmpeg_license.py

      - name: Tests (faux adb, faux serveur, interface hors écran)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Download platform-tools (pinned + SHA-256)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:PT_URL -OutFile pt.zip
          $h = (Get-FileHash pt.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:PT_SHA256) { throw "SHA-256 invalide : $h" }
          Expand-Archive pt.zip -DestinationPath pt -Force
          New-Item -ItemType Directory -Force platform-tools | Out-Null
          foreach ($f in "adb.exe","AdbWinApi.dll","AdbWinUsbApi.dll") {
            Copy-Item "pt\platform-tools\$f" "platform-tools\$f"
          }
          if (Test-Path "pt\platform-tools\NOTICE.txt") {
            Copy-Item "pt\platform-tools\NOTICE.txt" "platform-tools\NOTICE.txt"
          }

      - name: Build .exe with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name AndroMirror
          --icon assets/icon.ico
          --add-data "assets;assets"
          --add-data "third_party;third_party"
          --add-data "platform-tools;platform-tools"
          --add-data "server_android/build/andromirror-server.jar;server"
          --collect-all av
          main.py

      - name: "Verify artifact (auto-test du .exe - adb, FFmpeg, serveur embarqué, affichage)"
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if (-not (Test-Path "dist\AndroMirror.exe")) { throw "exe manquant" }
          $env:ANDROMIRROR_HOME = Join-Path $env:RUNNER_TEMP "andromirror-selftest"
          $res = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\AndroMirror.exe" -ArgumentList "--selftest", $res -Wait -PassThru
          if (-not (Test-Path $res)) { throw "auto-test : aucun résultat écrit (code $($p.ExitCode))" }
          $txt = (Get-Content $res -Raw).Trim()
          Write-Host $txt
          if ($p.ExitCode -ne 0 -or -not $txt.StartsWith("OK")) { throw "auto-test échoué : $txt" }

      - name: Upload AndroMirror.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AndroMirror
          path: dist/AndroMirror.exe
          if-no-files-found: error

      - name: Build installer (Inno Setup, optionnel)
        if: ${{ inputs.build_installer }}
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable" }
          & $iscc "build\AndroMirror.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué" }
          if (-not (Test-Path "dist\installer\AndroMirror-Setup.exe")) { throw "installateur manquant" }

      - name: Upload installer
        if: ${{ inputs.build_installer }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AndroMirror-Installateur
          path: dist/installer/AndroMirror-Setup.exe
          if-no-files-found: error
